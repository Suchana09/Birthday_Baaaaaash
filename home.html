
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excuse Me, Mr. Birthday Boy</title>

<link rel="stylesheet" href="style.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #f7efe7;
    color: #62483f;
    font-family: Georgia, serif;
    overflow: hidden;
}

.entry {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 15% 20%, #e8c9c555, transparent 30%),
      radial-gradient(circle at 85% 80%, #d7aaa555, transparent 30%),
      linear-gradient(135deg, #f7efe7, #f1dfd9, #f7efe7);
}

.content {
    position: relative;
    z-index: 2;
    animation: appear 1.5s ease;
}

.topline {
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #a17e73;
    margin-bottom: 30px;
}

h1 {
    font-size: clamp(48px, 8vw, 85px);
    font-weight: normal;
    line-height: 1.05;
    margin: 25px 0;
    color: #62483f;
}

h1 span {
    font-style: italic;
    color: #b87978;
}

.subtitle {
    font-size: 16px;
    line-height: 1.9;
    color: #947a70;
    margin: 20px 0;
}

.envelope {
    width: 125px;
    height: 90px;
    background: #d7aaa5;
    margin: 35px auto;
    position: relative;
    display: grid;
    place-items: center;
    box-shadow: 0 15px 35px #62483f25;
    animation: float 3s ease-in-out infinite;
}

.envelope::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #e9c6c0;
    clip-path: polygon(0 0, 50% 60%, 100% 0);
}

.envelope::after {
    content: "♡";
    position: absolute;
    color: white;
    font-size: 30px;
}

.enter-btn {
    display: inline-block;
    text-decoration: none;
    margin-top: 25px;
    padding: 15px 35px;
    background: #62483f;
    color: #fffaf5;
    font-size: 13px;
    letter-spacing: 2px;
    transition: .4s;
}

.enter-btn:hover {
    background: #b87978;
    transform: translateY(-4px);
    box-shadow: 0 10px 25px #62483f30;
}

.note {
    margin-top: 25px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    color: #a17e73;
}

.decor {
    position: absolute;
    color: #b8797855;
    pointer-events: none;
}

.d1 { top: 10%; left: 10%; font-size: 55px; }
.d2 { bottom: 12%; right: 10%; font-size: 65px; }
.d3 { top: 25%; right: 18%; font-size: 22px; }
.d4 { bottom: 25%; left: 17%; font-size: 28px; }

@keyframes float {
    50% { transform: translateY(-10px) rotate(3deg); }
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 600px) {
    .topline { letter-spacing: 3px; }
    .subtitle { font-size: 14px; }
    .d1 { left: 4%; }
    .d2 { right: 4%; }
}
</style>
</head>

<body>

<section class="entry">

    <div class="decor d1">✳</div>
    <div class="decor d2">✧</div>
    <div class="decor d3">♡</div>
    <div class="decor d4">✦</div>

    <div class="content">

        <div class="topline">
            A little something, made with a lot of love
        </div>

        <div class="envelope"></div>

        <h1>
            Excuse me,<br>
            Mr. <span>Birthday Boy.</span>
        </h1>

        <p class="subtitle">
            Someone has been planning something for you.<br>
            And for once, you're not allowed to ask too many questions.
        </p>

        <a href="museum.html" class="enter-btn">
            ENTER YOUR LITTLE WORLD ♡
        </a>

        <p class="note">
            BEST EXPERIENCED WITHOUT RUSHING.
        </p>

    </div>
</section>

</body>
</html>
